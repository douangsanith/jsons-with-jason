<!-- ANNOTATED VERSION — same page as matter-intelligence.html, with teaching
     comments. Read this one to learn; use the clean one to build.

     This is the "anatomy of a Claude artifact": ONE self-contained .html file
     that holds all three layers of the web at once —
       STRUCTURE (HTML)  +  STYLE (CSS in <style>)  +  BEHAVIOR (JS in <script>).
     That's why an artifact can be a single file you open anywhere. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matter Intelligence</title>

  <!-- ========= STYLE: all CSS is inlined here so the file is self-contained =========
       A <style> block lets you write CSS directly inside the HTML instead of a
       separate .css file — handy for a one-file artifact. Same rules as always:
       selector { property: value; }. -->
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f6f7f9; }
    .card {
      max-width: 680px; margin: 24px auto; padding: 20px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    }
    h1 { color: #1e3a8a; font-size: 22px; margin: 0 0 4px 0; }
    .subtitle { color: #6b7280; margin-top: 0; }
    .toolbar { margin: 12px 0; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef2f7; }
    th { background: #f3f4f6; font-size: 13px; color: #374151; }
    .disclaimer { color: #9ca3af; font-size: 12px; }
  </style>
</head>

<body>
  <!-- ========= BODY: everything the visitor sees ========= -->
  <div class="card">
    <header>
      <h1>Matter Intelligence</h1>
      <!-- id="count" is a UNIQUE name (only one per page). The JavaScript below
           uses that id to find this <span> and update the number inside it. -->
      <p class="subtitle"><span id="count">4</span> matters shown.</p>
    </header>

    <div class="toolbar">
      <!-- <button> is a clickable control. Its id="toggle" lets the script attach
           a click handler to it. -->
      <button id="toggle">Show active only</button>
    </div>

    <table id="matters">
      <thead>
        <tr><th>Matter</th><th>Client</th><th>Practice area</th><th>Billed</th></tr>
      </thead>
      <tbody>
        <!-- data-active is a "data attribute" — a custom bit of info we attach to
             an element for our own JavaScript to read. It isn't shown to the user;
             the script uses it to decide which rows to hide. -->
        <tr data-active="true"><td>M-1002</td><td>Brightline LLC</td><td>Litigation</td><td>$42,750.50</td></tr>
        <tr data-active="true"><td>M-1001</td><td>Acme Corp</td><td>Contracts</td><td>$18,500.00</td></tr>
        <tr data-active="false"><td>M-1003</td><td>Cedar Holdings</td><td>M&amp;A</td><td>$131,200.00</td></tr>
        <tr data-active="true"><td>M-1004</td><td>Dovetail Inc</td><td>Employment</td><td>$9,800.00</td></tr>
      </tbody>
    </table>

    <footer><p class="disclaimer">Not legal advice · a lawyer reviews any AI output.</p></footer>
  </div>

  <!-- ========= SCRIPT: all behavior is inlined here =========
       A <script> block holds JavaScript — the BEHAVIOR layer. It runs in the
       browser and can read and change the page in response to clicks. -->
  <script>
    // A tiny bit of JavaScript (Week 4's topic). It filters the table to active matters.

    // rows() finds every data row in the table. document.querySelectorAll uses a
    // CSS selector to grab elements; Array.from turns the result into a real array
    // so we can loop over it with .forEach below.
    const rows = () => Array.from(document.querySelectorAll('#matters tbody tr'));
    // getElementById finds the one element whose id matches — here, the count span.
    const countEl = document.getElementById('count');
    // A variable that remembers whether the filter is currently on. `let` (not
    // `const`) because its value changes each click.
    let activeOnly = false;

    // addEventListener("click", …) runs the given function every time the button
    // is clicked. This is how a page "reacts" to the user.
    document.getElementById('toggle').addEventListener('click', () => {
      activeOnly = !activeOnly;          // flip true <-> false
      let shown = 0;                     // count how many rows end up visible
      rows().forEach(tr => {
        const isActive = tr.getAttribute('data-active') === 'true';  // read our custom attribute
        const visible = !activeOnly || isActive;                     // show all, or only active
        tr.style.display = visible ? '' : 'none';                    // '' = default (shown), 'none' = hidden
        if (visible) shown++;
      });
      countEl.textContent = shown;       // update the number on screen
      // Update the button label so it describes what clicking it will do next.
      document.getElementById('toggle').textContent = activeOnly ? 'Show all' : 'Show active only';
    });
  </script>
</body>
</html>
