<!-- ANNOTATED VERSION — same page as index.html, with teaching comments.
     Read this one to learn; use the clean index.html to build.
     It loads main.annotated.js, so the whole annotated set runs together.

     Week 4 · Day 4 — Modules & async
     This page MUST be served over http:// — see the lesson. From this folder:
        python3 -m http.server
     then visit http://localhost:8000/index.annotated.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modules &amp; async — matters (annotated)</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f6f7f9; margin: 0; }
    .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h1 { color: #1e3a8a; font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #6b7280; margin-top: 0; }
    /* <pre> keeps whitespace and line breaks exactly as written — right for log output. */
    pre {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;   /* long lines scroll inside the box instead of stretching the page */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Modules &amp; async</h1>
    <p class="subtitle">
      The output of <code>main.annotated.js</code> — the same lines you get from
      <code>node main.annotated.js</code>. Watch the <em>fetching…</em> line appear before the results.
    </p>
    <!-- main.js never touches the page. The shim below fills this in. -->
    <pre id="out"></pre>
  </div>

  <!-- A plain script runs immediately; module scripts wait until the page is parsed
       (they are deferred automatically). So this shim is guaranteed to be in place
       before main.js logs anything.

       What it does: keeps a reference to the real console.log, then replaces
       console.log with a version that calls the original AND appends to the page.
       (...args) collects however many arguments were passed — the rest pattern
       again, this time on a function. Handy, but a teaching convenience only;
       don't reassign console.log in real code. -->
  <script>
    const outEl = document.getElementById("out");
    const original = console.log;
    console.log = (...args) => {
      original(...args);                              // still goes to DevTools
      outEl.textContent += args.join(" ") + "\n";     // and onto the page
    };
  </script>

  <!-- type="module" is what enables import/export in the browser. It also makes
       the browser fetch main.annotated.js as a separate request — which is exactly
       why file:// fails and you need python3 -m http.server. -->
  <script type="module" src="main.annotated.js"></script>
</body>
</html>
