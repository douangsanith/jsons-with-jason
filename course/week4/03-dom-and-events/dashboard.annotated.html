<!-- ANNOTATED VERSION — same page as dashboard.html, with teaching comments.
     Read this one to learn; use the clean dashboard.html to build.
     It loads dashboard.annotated.js, so both halves of the lesson are annotated.

     Week 4 · Day 3 — The DOM & events
     Open this file in a browser (double-click it). -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matter Intelligence — live dashboard (annotated)</title>
  <style>
    /* Same design tokens as the Week 3 artifact — this is the same product.
       Nothing here is new: it's Week 3 Day 2 (box model) and Day 3 (flex + grid). */
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      background: #f6f7f9;
      margin: 0;
    }
    .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h1 { color: #1e3a8a; font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #6b7280; margin-top: 0; }

    /* The controls row — a flexbox row, straight from Week 3 Day 3.
       gap spaces the children; align-items centres them on one line. */
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    input[type="search"] {
      font: inherit;              /* inputs don't inherit fonts by default — this fixes that */
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      flex: 1;                    /* grow to fill the leftover space in the flex row */
    }
    label { color: #374151; font-size: 14px; }

    /* The responsive card grid — Week 3 Day 3 again. auto-fit + minmax means
       "as many columns as fit, each at least 180px" — no media query needed. */
    .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; background: #fff; }
    .card h3 { margin: 0 0 6px 0; color: #1e3a8a; font-size: 16px; }
    .card p { margin: 2px 0; color: #374151; font-size: 14px; }
    .card .amt { font-weight: 600; }
    .tag {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 999px;       /* a huge radius makes a pill */
      font-size: 12px;
    }
    /* A second class on the same element overrides the colours for closed matters. */
    .tag.closed { background: #f3f4f6; color: #6b7280; }
    .empty { color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Matter Intelligence</h1>
      <!-- JavaScript will write into this element.
           The id is the HOOK: it's how dashboard.js finds this <p>.
           "Loading…" is only ever visible for a split second before render() runs. -->
      <p class="subtitle" id="summary">Loading…</p>
    </header>

    <!-- The hooks: JavaScript finds these by their id.
         An id must be unique on the page — that's what makes getElementById work. -->
    <div class="controls">
      <!-- type="search" is a text box that browsers give a clear-X button.
           placeholder is the grey hint text shown while it's empty. -->
      <input type="search" id="search" placeholder="Search client or practice area…">
      <!-- Wrapping the checkbox in its own <label> means clicking the words toggles it too. -->
      <label><input type="checkbox" id="active-only"> Active only</label>
    </div>

    <!-- Empty on purpose. Every card below is built by dashboard.js.
         View this page's source and you'll see nothing here; open the browser's
         DevTools "Elements" panel and you'll see the cards — that's the difference
         between the file on disk and the live DOM. -->
    <div class="board" id="board"></div>
  </div>

  <!-- The <script> goes LAST, just before </body>, so every element above already
       exists by the time the code runs. Put it in the <head> instead and
       getElementById returns null, because the page isn't built yet. -->
  <script src="dashboard.annotated.js"></script>
</body>
</html>
