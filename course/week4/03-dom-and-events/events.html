<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS events — matters</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; margin: 24px; }
    .box { max-width: 380px; padding: 16px; border: 1px solid #e5e7eb; border-radius: 10px; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Open this file in a browser and click the button. This is the DOM + events:
       JavaScript reaching into the page and reacting to a click. -->
  <div class="box">
    <p>Open matters: <strong id="count">3</strong></p>
    <button id="close">Close one</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    // document.getElementById(...) reaches into the DOM to find an element.
    const countEl = document.getElementById("count");

    // addEventListener wires a user action ("click") to a function.
    document.getElementById("close").addEventListener("click", () => {
      const n = Number(countEl.textContent);
      if (n > 0) countEl.textContent = n - 1;
    });

    document.getElementById("reset").addEventListener("click", () => {
      countEl.textContent = 3;
    });
  </script>
</body>
</html>
